
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta - StudySpaces</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/cuenta.css">
</head>
<body>
    <header>
        <div class="barra">
            <h1>📖 StudySpaces</h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="mis-resenas.html">Mis reseñas</a>
                <a href="mi-cuenta.html">Mi cuenta</a>
            </nav>
        </div>
    </header>

    <section class="encabezado-pagina">
        <h2>Mi cuenta</h2>
        <p>Administrá tu perfil de StudySpaces.</p>
    </section>

    <div class="contenedor-cuenta">
        <div id="accesoCuenta" class="formulario-cuenta cuenta-informacion">
            <h3>Bienvenido a StudySpaces</h3>

            <p>
                Para acceder a tu perfil, necesitás iniciar sesión.
            </p>

            <a class="boton-detalle" href="login.html">
                Iniciar sesión
            </a>

            <a class="boton-secundario" href="registro.html">
                Crear una cuenta
            </a>
        </div>

        <div id="perfilCuenta" class="formulario-cuenta cuenta-informacion" hidden>
            <div id="inicialCuenta" class="avatar-cuenta"></div>

            <h3 id="nombreCuenta"></h3>
            <p id="emailCuenta"></p>

            <button id="cerrarSesion" type="button">
                Cerrar sesión
            </button>
        </div>

        <p id="mensajeCuenta" class="mensaje-cuenta"></p>
    </div>

    <footer>
        <p>StudySpaces - Encontrá tu lugar ideal para estudiar</p>
    </footer>

    <script src="js/menu.js"></script>
</body>
</html>
