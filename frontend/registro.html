
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - StudySpaces</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/cuenta.css">
</head>
<body>
    <header>
        <div class="barra">
            <h1>📖 StudySpaces</h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="mis-resenas.html">Mis reseñas</a>
                <a href="mi-cuenta.html">Mi cuenta</a>
            </nav>
        </div>
    </header>

    <section class="encabezado-pagina">
        <h2>Crear una cuenta</h2>
        <p>Registrate para formar parte de StudySpaces.</p>
    </section>

    <div class="contenedor-cuenta">
        <form id="formRegistro" class="formulario-cuenta">
            <label for="nombreRegistro">Nombre</label>
            <input type="text" id="nombreRegistro" required
                placeholder="Tu nombre">

            <label for="emailRegistro">Correo electrónico</label>
            <input type="email" id="emailRegistro" required
                placeholder="ejemplo@correo.com">

            <label for="passwordRegistro">Contraseña</label>
            <input type="password" id="passwordRegistro" required
                minlength="8" placeholder="Mínimo 8 caracteres">

            <label for="confirmarPassword">Confirmar contraseña</label>
            <input type="password" id="confirmarPassword" required
                placeholder="Repetí tu contraseña">

            <button type="submit">Registrarme</button>

            <p id="mensajeRegistro" class="mensaje-cuenta"></p>

            <p class="enlace-cuenta">
                ¿Ya tenés cuenta?
                <a href="login.html">Iniciá sesión</a>
            </p>
        </form>
    </div>

    <footer>
        <p>StudySpaces - Encontrá tu lugar ideal para estudiar</p>
    </footer>

    <script src="js/cuenta.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
